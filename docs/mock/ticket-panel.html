<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<title>Ticket panel + modal</title>
</head>
<body>
<div class="chat">
  <div class="message">
<div class="container" style="--accent:#3498db"><div class="text-display"><h2>Support Tickets</h2><p>Open a ticket for anything account or billing related. One ticket per issue, please.</p></div><div class="separator"></div><div class="text-display"><p class="li">Before opening: check <span class="mention">#known-issues</span> for known issues</p><p class="li">Tickets are private between you and staff</p><p class="li">Abandoned tickets close after 48h of inactivity</p></div><div class="action-row"><button class="btn success"><span>Open a ticket</span></button><button class="btn secondary"><span>My tickets</span></button><button class="btn link"><span>FAQ</span></button></div></div>
  </div>
</div>
</body>
</html>
